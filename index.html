<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر العروض - Affiliate Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #f8fafc;
            -webkit-tap-highlight-color: transparent;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .num-en { font-variant-numeric: lining-nums; direction: ltr; display: inline-block; }
    </style>
</head>
<body class="text-slate-800 pb-20">

    <!-- الهيدر -->
    <header class="sticky top-0 z-40 bg-slate-900 text-white shadow-lg">
        <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between gap-3">
            <div class="flex items-center gap-2">
                <div class="w-10 h-10 rounded-xl bg-teal-500 flex items-center justify-center font-black text-xl shadow">
                    🛍️
                </div>
                <div>
                    <h1 id="headerStoreName" class="font-black text-lg leading-tight">متجر العروض الذكية</h1>
                    <p class="text-xs text-teal-300 font-bold">أفضل المنتجات بأقل الأسعار</p>
                </div>
            </div>
            <button onclick="openAdminModal()" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 px-3 py-2 rounded-xl text-xs font-bold flex items-center gap-1.5 transition active:scale-95">
                <span>⚙️</span>
                <span>لوحة التحكم</span>
                <span id="ordersBadge" class="hidden bg-rose-500 text-white text-[10px] px-1.5 py-0.5 rounded-full num-en">0</span>
            </button>
        </div>

        <!-- شريط البحث -->
        <div class="max-w-6xl mx-auto px-4 pb-3">
            <div class="relative">
                <input type="text" id="searchInput" oninput="renderProducts()" placeholder="ابحث عن منتج..."
                    class="w-full bg-slate-800 text-white placeholder-slate-400 rounded-xl py-2.5 pr-10 pl-4 text-sm font-bold focus:outline-none focus:ring-2 focus:ring-teal-500">
                <span class="absolute right-3 top-2.5 text-slate-400">🔍</span>
            </div>
        </div>
    </header>

    <!-- الأقسام -->
    <section class="max-w-6xl mx-auto px-4 pt-4">
        <div id="categoriesBar" class="flex gap-2 overflow-x-auto no-scrollbar pb-2">
            <!-- يتم توليد الأزرار بالجافاسكربت -->
        </div>
    </section>

    <!-- شبكة المنتجات -->
    <main class="max-w-6xl mx-auto px-4 pt-3">
        <div id="productsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
            <!-- يتم عرض المنتجات هنا -->
        </div>
        <div id="emptyState" class="hidden text-center py-16">
            <p class="text-4xl mb-2">📦</p>
            <p class="font-bold text-slate-500">لا توجد منتجات مطابقة لبحثك</p>
        </div>
    </main>

    <!-- نافذة الطلب المباشر (الدفع عند الاستلام - تاجر / أفلييت محلي) -->
    <div id="orderModal" class="fixed inset-0 z-50 hidden bg-black/60 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4">
        <div class="bg-white w-full sm:max-w-md rounded-t-3xl sm:rounded-3xl p-5 shadow-2xl max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center border-b pb-3 mb-4">
                <h2 class="font-black text-lg text-slate-900">تأكيد الطلب (الدفع عند الاستلام)</h2>
                <button onclick="closeOrderModal()" class="w-8 h-8 rounded-full bg-slate-100 font-bold text-slate-600">✕</button>
            </div>

            <div id="orderProductSummary" class="flex gap-3 bg-slate-50 p-3 rounded-2xl mb-4 border border-slate-100">
                <!-- ملخص المنتج -->
            </div>

            <form id="codOrderForm" onsubmit="submitCodOrder(event)" class="space-y-3">
                <input type="hidden" id="orderProductId">
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">الاسم بالكامل</label>
                    <input type="text" id="custName" required placeholder="مثال: أحمد محمد" class="w-full border border-slate-300 rounded-xl p-2.5 text-sm font-bold focus:ring-2 focus:ring-teal-500 outline-none">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">رقم الموبايل (إنجليزي)</label>
                        <input type="tel" id="custPhone" required pattern="[0-9+]+" placeholder="01012345678" dir="ltr" class="w-full border border-slate-300 rounded-xl p-2.5 text-sm font-bold text-left focus:ring-2 focus:ring-teal-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">الكمية</label>
                        <input type="number" id="custQty" min="1" value="1" oninput="updateOrderTotal()" dir="ltr" class="w-full border border-slate-300 rounded-xl p-2.5 text-sm font-bold text-center focus:ring-2 focus:ring-teal-500 outline-none">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">المحافظة والعنوان بالتفصيل</label>
                    <textarea id="custAddress" required rows="2" placeholder="المحافظة - المدينة - الشارع - علامة مميزة" class="w-full border border-slate-300 rounded-xl p-2.5 text-sm font-bold focus:ring-2 focus:ring-teal-500 outline-none"></textarea>
                </div>

                <div class="bg-teal-50 border border-teal-200 rounded-xl p-3 flex justify-between items-center">
                    <span class="font-bold text-sm text-teal-900">الإجمالي المطلوب:</span>
                    <span id="orderTotalDisplay" class="font-black text-lg text-teal-700 num-en">0 EGP</span>
                </div>

                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-black py-3 rounded-xl shadow-lg flex items-center justify-center gap-2 transition active:scale-95">
                    <span>تأكيد وإرسال عبر واتساب</span>
                    <span>📲</span>
                </button>
            </form>
        </div>
    </div>

    <!-- نافذة لوحة التحكم -->
    <div id="adminModal" class="fixed inset-0 z-50 hidden bg-black/60 backdrop-blur-sm flex items-center justify-center p-2 sm:p-4">
        <div class="bg-white w-full max-w-2xl rounded-3xl shadow-2xl max-h-[90vh] flex flex-col overflow-hidden">
            <div class="bg-slate-900 text-white p-4 flex justify-between items-center">
                <h2 class="font-black text-lg">⚙️ لوحة تحكم المتجر</h2>
                <button onclick="closeAdminModal()" class="w-8 h-8 rounded-full bg-slate-800 font-bold">✕</button>
            </div>

            <!-- تبويبات لوحة التحكم -->
            <div class="flex border-b bg-slate-50 text-xs sm:text-sm font-bold">
                <button onclick="switchAdminTab('add')" id="tab-add" class="flex-1 py-3 border-b-2 border-teal-600 text-teal-700">➕ إضافة منتج</button>
                <button onclick="switchAdminTab('list')" id="tab-list" class="flex-1 py-3 border-b-2 border-transparent text-slate-500">📦 المنتجات</button>
                <button onclick="switchAdminTab('orders')" id="tab-orders" class="flex-1 py-3 border-b-2 border-transparent text-slate-500">🧾 الطلبات</button>
                <button onclick="switchAdminTab('settings')" id="tab-settings" class="flex-1 py-3 border-b-2 border-transparent text-slate-500">🔧 الإعدادات</button>
            </div>

            <div class="p-4 overflow-y-auto flex-1">
                <!-- 1. إضافة منتج -->
                <form id="addProductForm" onsubmit="addProduct(event)" class="space-y-3">
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">اسم المنتج</label>
                        <input type="text" id="pName" required placeholder="مثال: سماعة بلوتوث أصلية" class="w-full border rounded-xl p-2.5 text-sm font-bold">
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-bold text-slate-600 mb-1">السعر الحالي (جنيه)</label>
                            <input type="number" id="pPrice" required min="1" dir="ltr" placeholder="450" class="w-full border rounded-xl p-2.5 text-sm font-bold text-left">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-600 mb-1">السعر قبل الخصم (اختياري)</label>
                            <input type="number" id="pOldPrice" dir="ltr" placeholder="600" class="w-full border rounded-xl p-2.5 text-sm font-bold text-left">
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-bold text-slate-600 mb-1">القسم</label>
                            <select id="pCategory" class="w-full border rounded-xl p-2.5 text-sm font-bold bg-white">
                                <option value="إلكترونيات">إلكترونيات</option>
                                <option value="أدوات منزلية">أدوات منزلية</option>
                                <option value="إكسسوارات">إكسسوارات</option>
                                <option value="عروض خاصة">عروض خاصة</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-600 mb-1">نوع الأفلييت</label>
                            <select id="pType" onchange="toggleLinkField()" class="w-full border rounded-xl p-2.5 text-sm font-bold bg-white">
                                <option value="link">رابط عمولة (أمازون / نون)</option>
                                <option value="cod">طلب مباشر (تاجر / دفع عند الاستلام)</option>
                            </select>
                        </div>
                    </div>
                    <div id="affiliateLinkBox">
                        <label class="block text-xs font-bold text-slate-600 mb-1">رابط العمولة الخاص بك (Affiliate URL)</label>
                        <input type="url" id="pLink" dir="ltr" placeholder="https://www.amazon.eg/dp/..." class="w-full border rounded-xl p-2.5 text-sm font-bold text-left">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">رابط صورة المنتج (URL)</label>
                        <input type="url" id="pImage" required dir="ltr" placeholder="https://..." class="w-full border rounded-xl p-2.5 text-sm font-bold text-left">
                    </div>
                    <button type="submit" class="w-full bg-teal-600 hover:bg-teal-700 text-white font-black py-3 rounded-xl shadow">
                        حفظ ونشر المنتج
                    </button>
                </form>

                <!-- 2. إدارة المنتجات -->
                <div id="adminProductsList" class="hidden space-y-2"></div>

                <!-- 3. الطلبات المسجلة -->
                <div id="adminOrdersList" class="hidden space-y-3"></div>

                <!-- 4. الإعدادات -->
                <form id="settingsForm" onsubmit="saveSettings(event)" class="hidden space-y-3">
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">اسم المتجر</label>
                        <input type="text" id="setStoreName" required class="w-full border rounded-xl p-2.5 text-sm font-bold">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">رقم واتساب استقبال الطلبات (بكود الدولة بدون +)</label>
                        <input type="tel" id="setWhatsapp" required dir="ltr" placeholder="201000000000" class="w-full border rounded-xl p-2.5 text-sm font-bold text-left">
                    </div>
                    <button type="submit" class="w-full bg-slate-900 text-white font-black py-3 rounded-xl">
                        حفظ الإعدادات
                    </button>
                    <button type="button" onclick="resetDemoData()" class="w-full bg-rose-50 text-rose-600 border border-rose-200 font-bold py-2.5 rounded-xl text-xs mt-2">
                        إعادة ضبط البيانات الافتراضية للتجربة
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- إشعار سريع (Toast) -->
    <div id="toast" class="fixed bottom-5 left-1/2 -translate-x-1/2 z-50 hidden bg-slate-900 text-white px-5 py-2.5 rounded-full text-sm font-bold shadow-xl"></div>

    <script>
        // صوت نقرة خفيف للتفاعل
        function playClickSound() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, ctx.currentTime);
                gain.gain.setValueAtTime(0.05, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.06);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.06);
            } catch (e) {}
        }

        // بيانات افتراضية للتجربة
        const DEFAULT_PRODUCTS = [
            {
                id: 1,
                name: "سماعة أذن لاسلكية عازلة للضوضاء مع شاشة شحن",
                price: 599,
                oldPrice: 850,
                category: "إلكترونيات",
                type: "link",
                link: "https://www.amazon.eg",
                image: "https://images.unsplash.com/photo-1590658268037-6bf12165a8df?w=500&q=80"
            },
            {
                id: 2,
                name: "خلاط محمول قابل للشحن USB لتحضير العصائر",
                price: 380,
                oldPrice: 520,
                category: "أدوات منزلية",
                type: "cod",
                link: "",
                image: "https://images.unsplash.com/photo-1570222094114-d054a817e56b?w=500&q=80"
            },
            {
                id: 3,
                name: "ساعة ذكية رياضية مقاومة للماء - شاشة AMOLED",
                price: 1250,
                oldPrice: 1600,
                category: "إكسسوارات",
                type: "link",
                link: "https://www.amazon.eg",
                image: "https://images.unsplash.com/photo-1546868871-7041f2a55e12?w=500&q=80"
            },
            {
                id: 4,
                name: "منظم مطبخ ذكي دوار للتوابل والأدوات",
                price: 275,
                oldPrice: 350,
                category: "أدوات منزلية",
                type: "cod",
                link: "",
                image: "https://images.unsplash.com/photo-1584622650111-993a426fbf0a?w=500&q=80"
            }
        ];

        const DEFAULT_SETTINGS = {
            storeName: "متجر العروض الذكية",
            whatsapp: "201000000000"
        };

        // تحميل البيانات من localStorage
        let products = JSON.parse(localStorage.getItem('aff_products')) || DEFAULT_PRODUCTS;
        let orders = JSON.parse(localStorage.getItem('aff_orders')) || [];
        let settings = JSON.parse(localStorage.getItem('aff_settings')) || DEFAULT_SETTINGS;
        let activeCategory = "الكل";

        function saveAll() {
            localStorage.setItem('aff_products', JSON.stringify(products));
            localStorage.setItem('aff_orders', JSON.stringify(orders));
            localStorage.setItem('aff_settings', JSON.stringify(settings));
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.remove('hidden');
            setTimeout(() => t.classList.add('hidden'), 2500);
        }

        // عرض الأقسام
        function renderCategories() {
            const cats = ["الكل", "إلكترونيات", "أدوات منزلية", "إكسسوارات", "عروض خاصة"];
            const bar = document.getElementById('categoriesBar');
            bar.innerHTML = cats.map(c => `
                <button onclick="selectCategory('${c}')"
                    class="px-4 py-1.5 rounded-full text-xs font-black whitespace-nowrap transition ${
                        activeCategory === c
                        ? 'bg-teal-600 text-white shadow'
                        : 'bg-white text-slate-600 border border-slate-200 hover:bg-slate-100'
                    }">
                    ${c}
                </button>
            `).join('');
        }

        function selectCategory(cat) {
            playClickSound();
            activeCategory = cat;
            renderCategories();
            renderProducts();
        }

        // عرض المنتجات
        function renderProducts() {
            const q = document.getElementById('searchInput').value.trim().toLowerCase();
            const grid = document.getElementById('productsGrid');
            const empty = document.getElementById('emptyState');

            const filtered = products.filter(p => {
                const matchCat = activeCategory === "الكل" || p.category === activeCategory;
                const matchSearch = p.name.toLowerCase().includes(q);
                return matchCat && matchSearch;
            });

            if (filtered.length === 0) {
                grid.innerHTML = '';
                empty.classList.remove('hidden');
                return;
            }

            empty.classList.add('hidden');
            grid.innerHTML = filtered.map(p => {
                const discount = p.oldPrice && p.oldPrice > p.price
                    ? Math.round(((p.oldPrice - p.price) / p.oldPrice) * 100)
                    : 0;

                const isLink = p.type === 'link';
                const badgeText = isLink ? 'عرض أمازون / متجر خارجي' : 'دفع عند الاستلام 🚚';
                const badgeColor = isLink ? 'bg-amber-100 text-amber-800' : 'bg-emerald-100 text-emerald-800';

                return `
                <div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden flex flex-col hover:shadow-md transition">
                    <div class="relative h-48 bg-slate-100 overflow-hidden">
                        <img src="${p.image}" alt="${p.name}" onerror="this.src='https://via.placeholder.com/400x300?text=No+Image'"
                            class="w-full h-full object-cover">
                        ${discount > 0 ? `<span class="absolute top-2 right-2 bg-rose-600 text-white text-xs font-black px-2 py-0.5 rounded-lg num-en">-${discount}%</span>` : ''}
                        <span class="absolute bottom-2 right-2 ${badgeColor} text-[11px] font-bold px-2.5 py-0.5 rounded-lg shadow-sm">${badgeText}</span>
                    </div>
                    <div class="p-4 flex flex-col flex-1 justify-between">
                        <div>
                            <span class="text-[11px] font-bold text-slate-400">${p.category}</span>
                            <h3 class="font-black text-slate-800 text-sm mt-0.5 line-clamp-2 leading-relaxed">${p.name}</h3>
                        </div>
                        <div class="mt-4">
                            <div class="flex items-baseline gap-2 mb-3">
                                <span class="font-black text-xl text-teal-700 num-en">${p.price.toLocaleString('en-US')}</span>
                                <span class="text-xs font-bold text-teal-700">ج.م</span>
                                ${p.oldPrice ? `<span class="text-xs font-bold text-slate-400 line-through num-en">${p.oldPrice.toLocaleString('en-US')} ج.م</span>` : ''}
                            </div>
                            ${isLink ? `
                                <a href="${p.link}" target="_blank" onclick="playClickSound()"
                                    class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-black py-2.5 rounded-xl text-sm flex items-center justify-center gap-2 transition active:scale-95">
                                    <span>اشتري الآن من العرض</span>
                                    <span>↗️</span>
                                </a>
                            ` : `
                                <button onclick="openOrderModal(${p.id})"
                                    class="w-full bg-teal-600 hover:bg-teal-700 text-white font-black py-2.5 rounded-xl text-sm flex items-center justify-center gap-2 transition active:scale-95">
                                    <span>اطلب الآن (عند الاستلام)</span>
                                    <span>🛒</span>
                                </button>
                            `}
                        </div>
                    </div>
                </div>
                `;
            }).join('');
        }

        // نافذة الطلب المباشر (COD)
        let currentOrderProduct = null;

        function openOrderModal(productId) {
            playClickSound();
            currentOrderProduct = products.find(p => p.id === productId);
            if (!currentOrderProduct) return;

            document.getElementById('orderProductId').value = productId;
            document.getElementById('custQty').value = 1;
            document.getElementById('orderProductSummary').innerHTML = `
                <img src="${currentOrderProduct.image}" class="w-16 h-16 rounded-xl object-cover">
                <div class="flex-1">
                    <h4 class="font-black text-sm text-slate-800 line-clamp-1">${currentOrderProduct.name}</h4>
                    <p class="text-teal-700 font-black text-sm mt-1 num-en">${currentOrderProduct.price.toLocaleString('en-US')} EGP</p>
                </div>
            `;
            updateOrderTotal();
            document.getElementById('orderModal').classList.remove('hidden');
        }

        function closeOrderModal() {
            document.getElementById('orderModal').classList.add('hidden');
        }

        function updateOrderTotal() {
            if (!currentOrderProduct) return;
            const qty = Math.max(1, parseInt(document.getElementById('custQty').value) || 1);
            const total = currentOrderProduct.price * qty;
            document.getElementById('orderTotalDisplay').textContent = `${total.toLocaleString('en-US')} EGP`;
        }

        function submitCodOrder(e) {
            e.preventDefault();
            playClickSound();

            const name = document.getElementById('custName').value.trim();
            const phone = document.getElementById('custPhone').value.trim();
            const qty = Math.max(1, parseInt(document.getElementById('custQty').value) || 1);
            const address = document.getElementById('custAddress').value.trim();
            const total = currentOrderProduct.price * qty;
            const dateStr = new Date().toLocaleDateString('en-GB'); // DD/MM/YYYY

            const newOrder = {
                id: Date.now(),
                productName: currentOrderProduct.name,
                price: currentOrderProduct.price,
                qty,
                total,
                name,
                phone,
                address,
                date: dateStr
            };

            orders.unshift(newOrder);
            saveAll();
            updateOrdersBadge();
            closeOrderModal();
            document.getElementById('codOrderForm').reset();
            showToast("تم تسجيل طلبك بنجاح! جاري فتح واتساب...");

            const msg = `طلب جديد من ${settings.storeName}%0A` +
                        `━━━━━━━━━━━━%0A` +
                        `📦 المنتج: ${newOrder.productName}%0A` +
                        `🔢 الكمية: ${qty}%0A` +
                        `💰 الإجمالي: ${total} ج.م%0A` +
                        `━━━━━━━━━━━━%0A` +
                        `👤 الاسم: ${name}%0A` +
                        `📱 الموبايل: ${phone}%0A` +
                        `📍 العنوان: ${address}%0A` +
                        `📅 التاريخ: ${dateStr}`;

            window.open(`https://wa.me/${settings.whatsapp}?text=${msg}`, '_blank');
        }

        // لوحة التحكم
        function openAdminModal() {
            playClickSound();
            document.getElementById('adminModal').classList.remove('hidden');
            document.getElementById('setStoreName').value = settings.storeName;
            document.getElementById('setWhatsapp').value = settings.whatsapp;
            renderAdminLists();
        }

        function closeAdminModal() {
            document.getElementById('adminModal').classList.add('hidden');
        }

        function switchAdminTab(tab) {
            playClickSound();
            const tabs = ['add', 'list', 'orders', 'settings'];
            const panels = {
                add: 'addProductForm',
                list: 'adminProductsList',
                orders: 'adminOrdersList',
                settings: 'settingsForm'
            };

            tabs.forEach(t => {
                document.getElementById(`tab-${t}`).className =
                    `flex-1 py-3 border-b-2 ${t === tab ? 'border-teal-600 text-teal-700' : 'border-transparent text-slate-500'}`;
                document.getElementById(panels[t]).classList.toggle('hidden', t !== tab);
            });

            if (tab === 'list' || tab === 'orders') renderAdminLists();
        }

        function toggleLinkField() {
            const type = document.getElementById('pType').value;
            const box = document.getElementById('affiliateLinkBox');
            box.classList.toggle('hidden', type !== 'link');
        }

        function addProduct(e) {
            e.preventDefault();
            playClickSound();
            const type = document.getElementById('pType').value;
            const link = document.getElementById('pLink').value.trim();

            if (type === 'link' && !link) {
                showToast("برجاء إدخال رابط العمولة");
                return;
            }

            const newProd = {
                id: Date.now(),
                name: document.getElementById('pName').value.trim(),
                price: Number(document.getElementById('pPrice').value),
                oldPrice: Number(document.getElementById('pOldPrice').value) || 0,
                category: document.getElementById('pCategory').value,
                type,
                link,
                image: document.getElementById('pImage').value.trim()
            };

            products.unshift(newProd);
            saveAll();
            renderProducts();
            document.getElementById('addProductForm').reset();
            toggleLinkField();
            showToast("تمت إضافة المنتج للمتجر ✅");
        }

        function deleteProduct(id) {
            playClickSound();
            products = products.filter(p => p.id !== id);
            saveAll();
            renderProducts();
            renderAdminLists();
            showToast("تم حذف المنتج");
        }

        function deleteOrder(id) {
            playClickSound();
            orders = orders.filter(o => o.id !== id);
            saveAll();
            updateOrdersBadge();
            renderAdminLists();
        }

        function renderAdminLists() {
            // قائمة المنتجات
            const listEl = document.getElementById('adminProductsList');
            listEl.innerHTML = products.map(p => `
                <div class="flex items-center justify-between gap-3 p-2.5 border rounded-xl bg-slate-50">
                    <div class="flex items-center gap-3 overflow-hidden">
                        <img src="${p.image}" class="w-12 h-12 rounded-lg object-cover shrink-0">
                        <div class="truncate">
                            <p class="font-bold text-sm truncate">${p.name}</p>
                            <p class="text-xs text-slate-500 font-bold num-en">${p.price} EGP • ${p.type === 'link' ? 'رابط عمولة' : 'دفع عند الاستلام'}</p>
                        </div>
                    </div>
                    <button onclick="deleteProduct(${p.id})" class="bg-rose-100 text-rose-700 px-3 py-1.5 rounded-lg text-xs font-bold shrink-0">حذف</button>
                </div>
            `).join('') || '<p class="text-center text-slate-400 py-8 font-bold">لا توجد منتجات</p>';

            // قائمة الطلبات
            const ordersEl = document.getElementById('adminOrdersList');
            ordersEl.innerHTML = orders.map(o => `
                <div class="p-3 border rounded-2xl bg-slate-50 space-y-1">
                    <div class="flex justify-between items-start">
                        <span class="font-black text-sm text-teal-800">${o.productName} (x${o.qty})</span>
                        <button onclick="deleteOrder(${o.id})" class="text-rose-600 text-xs font-bold">حذف</button>
                    </div>
                    <p class="text-xs font-bold text-slate-700">👤 ${o.name} — 📱 <span class="num-en">${o.phone}</span></p>
                    <p class="text-xs font-bold text-slate-500">📍 ${o.address}</p>
                    <div class="flex justify-between items-center pt-1 text-xs font-black">
                        <span class="text-emerald-700 num-en">الإجمالي: ${o.total} EGP</span>
                        <span class="text-slate-400 num-en">${o.date}</span>
                    </div>
                </div>
            `).join('') || '<p class="text-center text-slate-400 py-8 font-bold">لا توجد طلبات مسجلة حتى الآن</p>';
        }

        function saveSettings(e) {
            e.preventDefault();
            playClickSound();
            settings.storeName = document.getElementById('setStoreName').value.trim();
            settings.whatsapp = document.getElementById('setWhatsapp').value.trim();
            saveAll();
            applySettings();
            showToast("تم حفظ الإعدادات ✅");
        }

        function resetDemoData() {
            localStorage.removeItem('aff_products');
            localStorage.removeItem('aff_orders');
            localStorage.removeItem('aff_settings');
            location.reload();
        }

        function applySettings() {
            document.getElementById('headerStoreName').textContent = settings.storeName;
            document.title = settings.storeName;
        }

        function updateOrdersBadge() {
            const badge = document.getElementById('ordersBadge');
            if (orders.length > 0) {
                badge.textContent = orders.length;
                badge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
            }
        }

        // التشغيل الأولي
        applySettings();
        updateOrdersBadge();
        renderCategories();
        renderProducts();
    </script>
</body>
</html>
